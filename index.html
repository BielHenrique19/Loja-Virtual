<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja | Ofertas Especiais</title>
    <style>
        /* Estilos Gerais */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f5f5f5; color: #222; line-height: 1.5; }
        
        /* Cabeçalho Estilo Shopee */
        header { background: linear-gradient(180deg, #f53d2d 0%, #f63 100%); color: #fff; padding: 0.9rem 5%; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
        .header-top { max-width: 1150px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        header h1 { font-size: 1.5rem; letter-spacing: 0.5px; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
        
        /* Barra de Busca */
        .search-box { flex: 1; min-width: 220px; max-width: 600px; display: flex; background: white; border-radius: 4px; padding: 3px; }
        .search-box input { flex: 1; border: none; outline: none; padding: 0.5rem 0.8rem; font-size: 0.95rem; border-radius: 3px; }
        .search-box button { background: #ee4d2d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .search-box button:hover { background: #d73211; }

        .cart-btn { background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 0.6rem 1.1rem; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .cart-btn:hover { background-color: rgba(255,255,255,0.28); }

        /* Banner Principal */
        .hero { background: linear-gradient(135deg, #ee4d2d, #ff7337); color: white; text-align: center; padding: 2rem 1rem; margin-bottom: 1.2rem; }
        .hero h2 { font-size: 1.9rem; margin-bottom: 0.3rem; }
        .hero p { font-size: 1rem; opacity: 0.95; }

        /* Barra de Categorias */
        .categories { max-width: 1150px; margin: 0 auto 1.5rem auto; padding: 0 1rem; display: flex; gap: 0.6rem; overflow-x: auto; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-pill { background: white; border: 1px solid #e5e7eb; padding: 0.5rem 1.1rem; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 500; white-space: nowrap; transition: 0.2s; }
        .cat-pill.active, .cat-pill:hover { background: #ee4d2d; color: white; border-color: #ee4d2d; }

        /* Grade de Produtos */
        .container { max-width: 1150px; margin: auto; padding: 0 1rem; }
        .section-bar { background: white; padding: 0.9rem 1.2rem; border-bottom: 3px solid #ee4d2d; font-weight: bold; color: #ee4d2d; text-transform: uppercase; margin-bottom: 1rem; border-radius: 4px 4px 0 0; font-size: 0.95rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
        
        .product-card { background: white; border-radius: 6px; padding: 0.9rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; position: relative; border: 1px solid transparent; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.12); border-color: #ee4d2d; }
        
        .badge-off { position: absolute; top: 0; right: 0; background: #ffd839; color: #ee4d2d; font-weight: bold; font-size: 0.75rem; padding: 3px 7px; border-bottom-left-radius: 6px; border-top-right-radius: 5px; }
        .product-card img { width: 100%; height: 185px; object-fit: cover; border-radius: 4px; margin-bottom: 0.8rem; background-color: #f3f4f6; }
        .img-placeholder { width: 100%; height: 185px; border-radius: 4px; margin-bottom: 0.8rem; background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.85rem; }
        
        .product-card h3 { font-size: 0.98rem; font-weight: 500; margin-bottom: 0.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .old-price { font-size: 0.8rem; color: #9ca3af; text-decoration: line-through; }
        .price { font-size: 1.25rem; font-weight: bold; color: #ee4d2d; margin-bottom: 0.2rem; }
        .meta-info { font-size: 0.75rem; color: #6b7280; margin-bottom: 0.8rem; display: flex; justify-content: space-between; }
        
        .add-btn { background-color: #ee4d2d; color: white; border: none; padding: 0.65rem 1rem; border-radius: 4px; cursor: pointer; width: 100%; font-size: 0.92rem; font-weight: 600; transition: 0.2s; }
        .add-btn:hover { background-color: #d73211; }

        /* Modal do Carrinho */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); justify-content: center; align-items: center; z-index: 200; padding: 1rem; }
        .modal-content { background: white; padding: 1.5rem; border-radius: 8px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 0.8rem; margin-bottom: 1rem; }
        .modal-header h2 { font-size: 1.25rem; color: #ee4d2d; }
        .close-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #666; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0; gap: 0.5rem; font-size: 0.92rem; }
        .qty-controls { display: flex; align-items: center; gap: 0.4rem; }
        .qty-btn { background: #f3f4f6; border: 1px solid #d1d5db; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .remove-btn { color: #dc2626; background: none; border: none; cursor: pointer; font-size: 0.85rem; margin-left: 0.4rem; }
        
        /* Dados do Cliente no Checkout */
        .checkout-fields { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.6rem; background: #f9fafb; padding: 0.9rem; border-radius: 6px; border: 1px solid #e5e7eb; }
        .checkout-fields input, .checkout-fields select { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem; }
        
        .cart-total { font-size: 1.25rem; font-weight: bold; text-align: right; margin: 1rem 0; color: #111; }
        .cart-total span { color: #ee4d2d; }
        .checkout-btn { background-color: #25D366; color: white; border: none; padding: 0.85rem; width: 100%; border-radius: 5px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .checkout-btn:hover { background-color: #1ebe57; }

        /* Notificação Flutuante (Toast) */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 0.7rem 1.4rem; border-radius: 25px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 300; }
        .toast.show { opacity: 1; }

        /* Rodapé */
        footer { text-align: center; padding: 2rem 1rem; background: #ffffff; color: #6b7280; border-top: 1px solid #e5e7eb; margin-top: 2rem; font-size: 0.9rem; }

        /* Adaptação para Celulares (2 colunas igual Shopee) */
        @media (max-width: 600px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .product-card { padding: 0.65rem; }
            .product-card img, .img-placeholder { height: 145px; }
            .hero h2 { font-size: 1.4rem; }
            .header-top { gap: 0.6rem; }
            .search-box { order: 3; max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1 onclick="resetFilters()">🛍️ Minha Loja</h1>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar na Minha Loja..." onkeyup="applyFilters()">
                <button onclick="applyFilters()">Buscar</button>
            </div>
            <button class="cart-btn" onclick="toggleCart()">🛒 Carrinho (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <section class="hero">
        <h2>🔥 Ofertas Relâmpago com Entrega Rápida</h2>
        <p>Escolha seus itens abaixo e finalize seu pedido direto pelo WhatsApp!</p>
    </section>

    <!-- Filtro de Categorias -->
    <nav class="categories" id="category-bar">
        <button class="cat-pill active" onclick="setCategory('Todas', this)">Todas</button>
        <button class="cat-pill" onclick="setCategory('Eletrônicos', this)">Eletrônicos</button>
        <button class="cat-pill" onclick="setCategory('Acessórios', this)">Acessórios</button>
        <button class="cat-pill" onclick="setCategory('Casa', this)">Casa & Utilidades</button>
    </nav>

    <main class="container">
        <div class="section-bar">Descobertas do Dia</div>
        <div class="products-grid" id="products-list"></div>
    </main>

    <!-- Janela do Carrinho -->
    <div class="modal" id="cart-modal" onclick="if(event.target === this) toggleCart()">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Seu Carrinho</h2>
                <button class="close-btn" onclick="toggleCart()">&times;</button>
            </div>
            <div id="cart-items"></div>
            
            <div class="checkout-fields">
                <input type="text" id="client-name" placeholder="Seu Nome Completo *">
