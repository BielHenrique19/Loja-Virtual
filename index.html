<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja | Ofertas Especiais</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; color: #333; line-height: 1.6; }
        
        header { background-color: #111827; color: #fff; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.5rem; letter-spacing: 1px; }
        .cart-btn { background-color: #2563eb; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cart-btn:hover { background-color: #1d4ed8; }

        .hero { background: linear-gradient(135deg, #2563eb, #1e40af); color: white; text-align: center; padding: 3rem 1rem; margin-bottom: 2rem; }
        .hero h2 { font-size: 2.2rem; margin-bottom: 0.5rem; }

        .container { max-width: 1100px; margin: auto; padding: 0 1rem; }
        .search-bar { width: 100%; padding: 0.8rem 1rem; margin-bottom: 1.5rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .product-card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 1rem; background-color: #e5e7eb; }
        .img-placeholder { width: 100%; height: 200px; border-radius: 5px; margin-bottom: 1rem; background-color: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 0.9rem; }
        .product-card h3 { font-size: 1.2rem; margin-bottom: 0.3rem; }
        .product-desc { font-size: 0.9rem; color: #6b7280; margin-bottom: 0.8rem; }
        .price { font-size: 1.3rem; font-weight: bold; color: #16a34a; margin-bottom: 1rem; }
        .add-btn { background-color: #111827; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; transition: background-color 0.2s; }
        .add-btn:hover { background-color: #374151; }
        .add-btn.added { background-color: #16a34a; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0; gap: 0.5rem; }
        .qty-controls { display: flex; align-items: center; gap: 0.4rem; }
        .qty-btn { background: #e5e7eb; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .remove-btn { color: #dc2626; background: none; border: none; cursor: pointer; font-size: 0.9rem; margin-left: 0.5rem; }
        .cart-total { font-size: 1.3rem; font-weight: bold; text-align: right; margin: 1rem 0; }
        
        .checkout-form { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem; border-top: 1px solid #eee; padding-top: 1rem; }
        .checkout-form input, .checkout-form select { padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.95rem; }
        
        .checkout-btn { background-color: #16a34a; color: white; border: none; padding: 0.8rem; width: 100%; border-radius: 5px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .checkout-btn:hover { background-color: #15803d; }
        .checkout-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }

        footer { text-align: center; padding: 2rem; background: #111827; color: #9ca3af; margin-top: 2rem; }
    </style>
</head>
<body>

    <header>
        <h1>Minha Loja</h1>
        <button class="cart-btn" onclick="toggleCart()">🛒 Carrinho (<span id="cart-count">0</span>)</button>
    </header>

    <section class="hero">
        <h2>Os Melhores Produtos com Entrega Rápida</h2>
        <p>Escolha seus itens abaixo e finalize seu pedido direto pelo WhatsApp!</p>
    </section>

    <main class="container">
        <input type="text" class="search-bar" id="search-input" placeholder="Buscar produto..." oninput="renderProducts()">
        <div class="products-grid" id="products-list"></div>
    </main>

    <div class="modal" id="cart-modal" onclick="if(event.target === this) toggleCart()">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Carrinho</h2>
                <button class="close-btn" onclick="toggleCart()">&times;</button>
            </div>
            <div id="cart-items"></div>
            <div class="cart-total">Total: R$ <span id="cart-total">0,00</span></div>
            
            <div class="checkout-form" id="checkout-form">
                <input type="text" id="customer-name" placeholder="Seu nome *" required>
                <input type="text" id="customer-address" placeholder="Endereço de entrega (ou 'Retirar na loja') *" required>
                <select id="payment-method">
                    <option value="Pix">Pagamento via Pix</option>
                    <option value="Cartão de Crédito/Débito">Cartão na entrega</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>

            <button class="checkout-btn" id="checkout-btn" onclick="checkoutWhatsApp()">Finalizar Pedido no WhatsApp</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Minha Loja. Todos os direitos reservados.</p>
    </footer>

    <script>
        const WHATSAPP_NUMBER = "554384817218";

        const products = [
            { id: 1, name: "Fone Bluetooth Pro", desc: "Cancelamento de ruído e 24h de bateria.", price: 149.90, img: "" },
            { id: 2, name: "Smartwatch Esportivo", desc: "Monitor cardíaco, GPS e à prova d'água.", price: 229.00, img: "" },
            { id: 3, name: "Mochila Impermeável", desc: "Compartimento para notebook até 15.6''.", price: 119.50, img: "" },
            { id: 4, name: "Garrafa Térmica Inox", desc: "Mantém bebidas geladas por 24h (750ml).", price: 65.00, img: "" }
        ];

        let cart = JSON.parse(localStorage.getItem('minha_loja_cart')) || [];

        function saveCart() {
            localStorage.setItem('minha_loja_cart', JSON.stringify(cart));
        }

        function formatBRL(value) {
            return value.toFixed(2).replace('.', ',');
        }

        function renderProducts() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term) || p.desc.toLowerCase().includes(term));
            const list = document.getElementById('products-list');

            if (filtered.length === 0) {
                list.innerHTML = "<p>Nenhum produto encontrado.</p>";
                return;
            }

            list.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div>
                        ${p.img 
                            ? `<img src="${p.img}" alt="${p.name}">` 
                            : `<div class="img-placeholder">Sem imagem</div>`
                        }
                        <h3>${p.name}</h3>
                        <p class="product-desc">${p.desc}</p>
                    </div>
                    <div>
                        <p class="price">R$ ${formatBRL(p.price)}</p>
                        <button class="add-btn" id="btn-${p.id}" onclick="addToCart(${p.id})">Adicionar ao Carrinho</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                const product = products.find(p => p.id === id);
                if (product) cart.push({ ...product, qty: 1 });
            }
            saveCart();
            updateCartUI();

            const btn = document.getElementById(`btn-${id}`);
            if (btn) {
                btn.innerText = "✓ Adicionado";
                btn.classList.add("added");
                setTimeout(() => {
                    btn.innerText = "Adicionar ao Carrinho";
                    btn.classList.remove("added");
                }, 900);
            }
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            saveCart();
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
